name: Update user reports

# Once a day: read new App Store reviews, rebuild the pages and push.
# The push makes Cloudflare redeploy the site automatically.
on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-reviews
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch App Store reviews
        run: python tools/fetch_reviews.py

      - name: Rebuild pages
        run: python tools/build.py

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes today"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git commit -m "Daily user reports update ($(date -u +%Y-%m-%d))"
          git push
